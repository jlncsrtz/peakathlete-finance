
name: Supabase Keep Alive

on:
  schedule:
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Check Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing Supabase GitHub secrets."
            exit 1
          fi

          STATUS=$(curl --silent --show-error \
            --output /tmp/supabase-response.json \
            --write-out "%{http_code}" \
            --max-time 30 \
            --get \
            --data-urlencode "select=id" \
            --data-urlencode "limit=1" \
            "$SUPABASE_URL/rest/v1/products" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          if [ "$STATUS" != "200" ] && [ "$STATUS" != "206" ]; then
            echo "Supabase database check failed. HTTP $STATUS"
            cat /tmp/supabase-response.json
            exit 1
          fi

          echo "Supabase database query successful."